AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Team Rufus prototype. CloudFront serves the frontend from a private S3
  bucket and forwards /api/* and /health to the Flask backend on Lambda.

Globals:
  Function:
    Tags:
      Project: T-Level-Team-Project
      Environment: Development

Resources:
  # Both DynamoDB tables come from the existing template so there is one
  # definition of each table.
  Tables:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../infra/dynamodb-table.yaml

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.aws-sam/lambda-package
      Handler: backend.lambda_handler.handler
      Runtime: python3.12
      Architectures:
        - arm64
      # Password hashing is CPU-bound; more memory gives Lambda more CPU.
      MemorySize: 1024
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !GetAtt Tables.Outputs.TableName
          USERS_TABLE_NAME: !GetAtt Tables.Outputs.UsersTableName
          SESSIONS_TABLE_NAME: !GetAtt Tables.Outputs.SessionsTableName
          CONTENT_BUCKET_NAME: !Ref ContentBucket
      Policies:
        # Least privilege: only the actions each table needs.
        - Version: "2012-10-17"
          Statement:
            - Sid: CreateExpressionsOfInterest
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Tables.Outputs.TableArn
            - Sid: ManageUsersAndSessions
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt Tables.Outputs.UsersTableArn
                - !GetAtt Tables.Outputs.SessionsTableArn
            # Needed to sign download links; the bucket itself stays private.
            - Sid: ReadContentFiles
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ContentBucket.Arn}/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Caps total traffic so a public signup form cannot run up costs.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development

  # Downloadable content. Not connected to CloudFront: files are only
  # reachable through short-lived links signed by the Lambda function.
  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development

  # Only this CloudFront distribution can read the bucket.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Team Rufus prototype
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: Api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: Frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: Api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            # Managed-CachingDisabled: API responses must never be cached.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader: API Gateway needs its own Host.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /health
            TargetOriginId: Api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development

Outputs:
  SiteUrl:
    Description: Share this link with the team and assessors
    Value: !Sub "https://${Distribution.DomainName}"
  FrontendBucketName:
    Description: S3 bucket holding the frontend files
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution ID (used to clear the cache)
    Value: !Ref Distribution
  ContentBucketName:
    Description: Private S3 bucket holding downloadable content
    Value: !Ref ContentBucket
