AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Team Rufus prototype. CloudFront serves the frontend from a private S3
  bucket and forwards /api/* and /health to the Flask backend on Lambda.
  Every path requires Midway sign-in through CloudFrontSigner.

Parameters:
  DistributionEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Off by default. Amazon security (Shepherd) requires Midway authentication
      on any public CloudFront site in an Amazon account. deploy/deploy.sh
      sets this to "true" only after the CloudFrontSigner key is in place.
  CfsPublicKeyId:
    Type: String
    AllowedPattern: "^K[A-Z0-9]+$"
    Description: >-
      CloudFront public key used by CloudFrontSigner to sign Midway cookies.
      Created by deploy/midway.sh; never set by hand.

Conditions:
  DistributionOn: !Equals [!Ref DistributionEnabled, "true"]

Globals:
  Function:
    Tags:
      Project: T-Level-Team-Project
      Environment: Development

Resources:
  # Both DynamoDB tables come from the existing template so there is one
  # definition of each table.
  Tables:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../infra/dynamodb-table.yaml

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.aws-sam/lambda-package
      Handler: backend.lambda_handler.handler
      Runtime: python3.12
      Architectures:
        - arm64
      # Password hashing is CPU-bound; more memory gives Lambda more CPU.
      MemorySize: 1024
      # Chat answers from Claude can take several seconds.
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !GetAtt Tables.Outputs.TableName
          USERS_TABLE_NAME: !GetAtt Tables.Outputs.UsersTableName
          SESSIONS_TABLE_NAME: !GetAtt Tables.Outputs.SessionsTableName
          CONTENT_BUCKET_NAME: !Ref ContentBucket
          CHAT_MODEL_ID: anthropic.claude-opus-5-5
          # Claude answers in us-east-1 for this account; the guardrail and
          # everything else stay in the stack's region.
          CHAT_BEDROCK_REGION: us-east-1
          CHAT_GUARDRAIL_ID: !GetAtt ChatGuardrail.GuardrailId
          CHAT_GUARDRAIL_VERSION: !GetAtt ChatGuardrailVersion.Version
      Policies:
        # Least privilege: only the actions each table needs.
        - Version: "2012-10-17"
          Statement:
            - Sid: CreateExpressionsOfInterest
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt Tables.Outputs.TableArn
            - Sid: ManageUsersAndSessions
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt Tables.Outputs.UsersTableArn
                - !GetAtt Tables.Outputs.SessionsTableArn
            # Claude on Amazon Bedrock. Mantle grants are per account
            # project, not per model.
            - Sid: InvokeClaude
              Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: !Sub "arn:aws:bedrock-mantle:us-east-1:${AWS::AccountId}:project/default"
            - Sid: ApplyChatGuardrail
              Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !GetAtt ChatGuardrail.GuardrailArn
            # Needed to sign download links; the bucket itself stays private.
            - Sid: ReadContentFiles
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ContentBucket.Arn}/*"
      # IAM-only function URL: callable by this CloudFront distribution (through
      # origin access control) and nothing else, so the backend has no public
      # endpoint that skips Midway.
      FunctionUrlConfig:
        AuthType: AWS_IAM

  # Checks every chat question before it reaches Claude and every answer
  # before it is shown. Users can be 16 to 19, so filters are at their
  # strictest and the blocked message signposts help.
  ChatGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${AWS::StackName}-chat"
      Description: Team Rufus chat assistant guardrail
      BlockedInputMessaging: >-
        I can't help with that here. If you're worried about your safety or
        feeling very low, please talk to a trusted adult or your school or
        college's safeguarding lead. You can call Childline free on 0800 1111,
        or 999 in an emergency. I can answer questions about T Levels and
        placements.
      BlockedOutputsMessaging: >-
        Sorry, I can't answer that. Please ask me about T Levels, placements at
        Amazon, or this website.
      ContentPolicyConfig:
        FiltersConfig:
          - {Type: SEXUAL, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: VIOLENCE, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: HATE, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: INSULTS, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: MISCONDUCT, InputStrength: HIGH, OutputStrength: HIGH}
          - {Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE}
      # Personal details are masked (for example {EMAIL}) so they never reach
      # the model; card numbers and passwords block the message.
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - {Type: EMAIL, Action: ANONYMIZE}
          # Input only: answers include the Childline number.
          - {Type: PHONE, Action: ANONYMIZE, InputEnabled: true, OutputEnabled: false}
          - {Type: ADDRESS, Action: ANONYMIZE}
          - {Type: UK_NATIONAL_INSURANCE_NUMBER, Action: ANONYMIZE}
          - {Type: UK_NATIONAL_HEALTH_SERVICE_NUMBER, Action: ANONYMIZE}
          - {Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK}
          - {Type: PASSWORD, Action: BLOCK}
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development

  # Versions are immutable. After changing the guardrail above, change this
  # Description so CloudFormation publishes a new version.
  ChatGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt ChatGuardrail.GuardrailId
      Description: "v1: initial filters and PII masking"

  # CloudFront signs every origin request; Lambda only accepts those that come
  # from this distribution.
  ApiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-api"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ApiFunction
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ApiFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Viewers must present CloudFront cookies signed with this key, which only
  # CloudFrontSigner can issue after Midway sign-in and a Bindle check.
  CfsKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: !Sub "${AWS::StackName}-cloudfrontsigner"
        Comment: CloudFrontSigner (Midway) signing key
        Items:
          - !Ref CfsPublicKeyId

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development

  # Downloadable content. Not connected to CloudFront: files are only
  # reachable through short-lived links signed by the Lambda function.
  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development

  # Only this CloudFront distribution can read the bucket.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3 has no folder index pages, so map "/debug" and "/debug/" to
  # "/debug/index.html". Without this S3 returns 403, which CloudFront turns
  # into the Midway redirect page.
  IndexPageFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index-pages"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for folder paths
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Team Rufus prototype
        Enabled: !If [DistributionOn, true, false]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: Api
            # FunctionUrl is "https://<id>.lambda-url.<region>.on.aws/".
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt ApiOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              # Chat answers can take longer than the 30-second default.
              OriginReadTimeout: 60
              OriginSSLProtocols:
                - TLSv1.2
        # Midway: every behavior except /js/cfs-handler.js requires
        # CloudFrontSigner cookies. Without them CloudFront returns 403, which
        # serves /error/403.html; that page sends the browser to Midway.
        DefaultCacheBehavior:
          TargetOriginId: Frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          TrustedKeyGroups:
            - !Ref CfsKeyGroup
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexPageFunction.FunctionMetadata.FunctionARN
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          # Must stay public: the 403 page loads it to start the Midway redirect.
          - PathPattern: /js/cfs-handler.js
            TargetOriginId: Frontend
            ViewerProtocolPolicy: redirect-to-https
            # Managed-CachingDisabled so a key rotation takes effect at once.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /api/*
            TargetOriginId: Api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            TrustedKeyGroups:
              - !Ref CfsKeyGroup
            # Managed-CachingDisabled: API responses must never be cached.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader: the function URL needs its own
            # Host header for origin access control signing.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /health
            TargetOriginId: Api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            TrustedKeyGroups:
              - !Ref CfsKeyGroup
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          # Required by CloudFrontSigner: response code must stay 403.
          - ErrorCode: 403
            ResponseCode: 403
            ResponsePagePath: /error/403.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development

Outputs:
  SiteUrl:
    Description: Share this link with the team and assessors
    Value: !Sub "https://${Distribution.DomainName}"
  FrontendBucketName:
    Description: S3 bucket holding the frontend files
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution ID (used to clear the cache)
    Value: !Ref Distribution
  ContentBucketName:
    Description: Private S3 bucket holding downloadable content
    Value: !Ref ContentBucket
