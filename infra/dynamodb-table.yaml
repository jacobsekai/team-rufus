AWSTemplateFormatVersion: "2010-09-09"
Description: Development DynamoDB tables for T Level expressions of interest, user accounts, sign-in sessions, and the forum.

Parameters:
  TableName:
    Type: String
    Default: t-level-expressions-of-interest-dev
  UsersTableName:
    Type: String
    Default: t-level-users-dev
  SessionsTableName:
    Type: String
    Default: t-level-sessions-dev
  ForumTableName:
    Type: String
    Default: t-level-forum-dev

Resources:
  ExpressionsOfInterestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development
        - Key: DataClassification
          Value: Prototype

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref UsersTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development
        - Key: DataClassification
          Value: Prototype

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref SessionsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      # DynamoDB deletes expired sessions automatically.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development
        - Key: DataClassification
          Value: Prototype

  # Forum posts, comments, votes, reports and rate limits in one table
  # (key design: docs/dynamodb-design.md).
  ForumTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ForumTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # DynamoDB deletes finished rate-limit windows automatically.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: T-Level-Team-Project
        - Key: Environment
          Value: Development
        - Key: DataClassification
          Value: Prototype

Outputs:
  TableName:
    Description: DynamoDB table name
    Value: !Ref ExpressionsOfInterestTable
  TableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt ExpressionsOfInterestTable.Arn
  UsersTableName:
    Description: Users DynamoDB table name
    Value: !Ref UsersTable
  UsersTableArn:
    Description: Users DynamoDB table ARN
    Value: !GetAtt UsersTable.Arn
  SessionsTableName:
    Description: Sessions DynamoDB table name
    Value: !Ref SessionsTable
  SessionsTableArn:
    Description: Sessions DynamoDB table ARN
    Value: !GetAtt SessionsTable.Arn
  ForumTableName:
    Description: Forum DynamoDB table name
    Value: !Ref ForumTable
  ForumTableArn:
    Description: Forum DynamoDB table ARN
    Value: !GetAtt ForumTable.Arn
